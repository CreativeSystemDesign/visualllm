[package]
name = "visualllm"
version = "0.1.0"
description = "Design LLM endpoints by hand"
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Plain HTTP is all the gateway needs; rustls is here for the provider catalog
# that comes next, so TLS is not a later rebuild.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tauri-plugin-clipboard-manager = "2"


[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
