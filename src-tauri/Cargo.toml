[package]
name = "visualllm"
version = "0.5.2"
description = "Design reliable OpenAI-compatible endpoints by arranging AI models visually"
edition = "2021"
rust-version = "1.77"
authors = ["Shane Gross"]
license = "MIT"
repository = "https://github.com/CreativeSystemDesign/visualllm"
homepage = "https://github.com/CreativeSystemDesign/visualllm"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Plain HTTP is all the gateway needs; rustls is here for the provider catalog
# that comes next, so TLS is not a later rebuild.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
tauri-plugin-clipboard-manager = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync"] }
futures-util = "0.3"
keyring = { version = "3", default-features = false, features = ["linux-native"] }
getrandom = "0.2"

# Linux-only dependencies for window shaping and icon
[target.'cfg(target_os = "linux")'.dependencies]
gtk = { version = "=0.18.2", features = ["v3_24"] }
cairo-rs = { version = "0.18" }
gdk-pixbuf = { version = "0.18" }

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
