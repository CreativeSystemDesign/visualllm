  #         gpg_private_key: ${{ secrets.AUR_GPG_PRIVATE_KEY }}
  #         gpg_passphrase: ${{ secrets.AUR_GPG_PASSPHRASE }}

  flatpak:
    name: Flatpak package
    needs: [linux, windows, macos, release, create-tarball]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4
      - name: Download tarball for sha256
        uses: actions/download-artifact@v4
        with:
          name: visualllm-tarball
          path: artifacts
      - name: Calculate sha256 for tar.gz
        id: sha256
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          TAR_GZ=$(find artifacts -name "*.tar.gz" | head -1)
          if [ -z "$TAR_GZ" ]; then
            echo "No tar.gz found"
            exit 1
          fi
          SHA256=$(sha256sum "$TAR_GZ" | cut -d' ' -f1)
          echo "sha256=$SHA256" >> $GITHUB_OUTPUT
          echo "Found tar.gz: $TAR_GZ"
          echo "SHA256: $SHA256"
      - name: Install Flatpak tools
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder
          flatpak remote-add --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
      - name: Build Flatpak
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          SHA256="${{ steps.sha256.outputs.sha256 }}"
          mkdir -p flatpak-build
          cat > flatpak-build/com.visualllm.VisualLLM.json <<EOF
          {
            "app-id": "com.visualllm.VisualLLM",
            "runtime": "org.freedesktop.Platform",
            "runtime-version": "24.08",
            "sdk": "org.freedesktop.Sdk",
            "command": "visualllm",
            "finish-args": [
              "--socket=wayland",
              "--socket=fallback-x11",
              "--socket=pulseaudio",
              "--share=network",
              "--device=dri"
            ],
            "modules": [
              {
                "name": "visualllm",
                "buildsystem": "simple",
                "build-commands": [
                  "install -Dm755 visualllm /app/bin/visualllm",
                  "install -Dm644 io.github.creativesystemdesign.visualllm.desktop /app/share/applications/io.github.creativesystemdesign.visualllm.desktop",
                  "install -Dm644 icon.png /app/share/icons/hicolor/512x512/apps/io.github.creativesystemdesign.visualllm.png",
                  "install -Dm644 io.github.creativesystemdesign.visualllm.metainfo.xml /app/share/metainfo/io.github.creativesystemdesign.visualllm.metainfo.xml"
                ],
                "sources": [
                  {
                    "type": "archive",
                    "url": "https://github.com/CreativeSystemDesign/visualllm/releases/download/${TAG}/visualllm-${TAG}.tar.gz",
                    "sha256": "${SHA256}"
                  }
                ]
              }
            ]
          }
          EOF
          cat > flatpak-build/io.github.creativesystemdesign.visualllm.desktop <<EOF
          [Desktop Entry]
          Name=VisualLLM
          Exec=visualllm
          Icon=io.github.creativesystemdesign.visualllm
          Type=Application
          Categories=Utility;Development;
          Comment=Design reliable OpenAI-compatible endpoints by arranging AI models visually
          StartupNotify=true
          Terminal=false
          EOF
          wget -O flatpak-build/icon.png "https://raw.githubusercontent.com/CreativeSystemDesign/visualllm/main/src-tauri/icons/icon.png"
          wget -O flatpak-build/io.github.creativesystemdesign.visualllm.metainfo.xml "https://raw.githubusercontent.com/CreativeSystemDesign/visualllm/main/flatpak-visualllm/io.github.creativesystemdesign.visualllm.metainfo.xml"
          flatpak-builder --force-clean --repo=repo flatpak-build/io.github.creativesystemdesign.visualllm.json
          flatpak build-bundle repo visualllm-${TAG}.flatpak io.github.creativesystemdesign.visualllm
      - name: Upload Flatpak artifact
        uses: actions/upload-artifact@v4
        with:
          name: visualllm-flatpak
          path: visualllm-*.flatpak
      - name: Submit to Flathub
        if: env.FLATHUB_SUBMIT_TOKEN != ''
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          flatpak remote-add --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak build-bundle repo visualllm-${TAG}.flatpak io.github.creativesystemdesign.visualllm
          # Submit to Flathub using the submit API
          curl -X POST "https://flathub.org/api/v1/apps/io.github.creativesystemdesign.visualllm/submit" \
            -H "Authorization: Bearer ${FLATHUB_SUBMIT_TOKEN}" \
            -F "file=@visualllm-${TAG}.flatpak" \
            -F "notes=Release ${{ github.ref_name }}"
