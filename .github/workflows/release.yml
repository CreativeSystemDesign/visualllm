name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Shared setup to avoid duplication
  setup:
    name: Setup & cache
    runs-on: ubuntu-latest
    outputs:
      node-version: ${{ steps.node.outputs.node-version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        id: node
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci

  linux:
    name: Linux release
    needs: setup
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Tauri CLI
        run: npm install -g @tauri-apps/cli

      - name: Verify tag matches source version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VER="$(python3 -c "import json;print(json.load(open('src-tauri/tauri.conf.json'))['version'])")"
          if [ "${TAG#v}" != "$VER" ]; then
            echo "Tag $TAG does not match source version $VER in src-tauri/tauri.conf.json."
            echo "Bump Cargo.toml/tauri.conf.json/package.json to $VER and re-tag."
            exit 1
          fi
          echo "Tag $TAG matches source version $VER"

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - run: npm run smoke

      - name: Build (signed for auto-update)
        run: npm run build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Generate checksums
        working-directory: src-tauri/target/release/bundle
        run: |
          sha256sum deb/*.deb appimage/*.AppImage > SHA256SUMS
          cat SHA256SUMS

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: visualllm-linux
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/deb/*.deb.sig
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/appimage/*.AppImage.sig
            src-tauri/target/release/bundle/SHA256SUMS

  windows:
    name: Windows release
    needs: setup
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install WebView2 bootstrapper (for portable .exe)
        run: |
          # WebView2 is usually present on Windows 10/11, but we ensure the bootstrapper is available
          # The MSI installer will handle WebView2 installation automatically

      - name: Install Tauri CLI
        run: npm install -g @tauri-apps/cli

      - run: npm run smoke

      - name: Build (signed for auto-update)
        run: npm run build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Generate checksums
        working-directory: src-tauri/target/release/bundle
        run: |
          Get-FileHash -Algorithm SHA256 msi/*.msi, nsis/*.exe | Out-File SHA256SUMS.txt
          Get-Content SHA256SUMS.txt

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: visualllm-windows
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/msi/*.msi.sig
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.exe.sig
            src-tauri/target/release/bundle/SHA256SUMS.txt

  macos:
    name: macOS release
    needs: setup
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Tauri CLI
        run: npm install -g @tauri-apps/cli

      - run: npm run smoke

      - name: Build (signed for auto-update)
        run: npm run build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Generate checksums
        working-directory: src-tauri/target/release/bundle
        run: |
          shasum -a 256 dmg/*.dmg > SHA256SUMS
          cat SHA256SUMS

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: visualllm-macos
          path: |
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/dmg/*.dmg.sig
            src-tauri/target/release/bundle/macos/*
            src-tauri/target/release/bundle/SHA256SUMS

  macos-sign:
    name: Sign macOS artifacts
    needs: macos
    runs-on: macos-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4
      - name: Download macOS artifacts
        uses: actions/download-artifact@v4
        with:
          name: visualllm-macos
          path: artifacts
      - name: Import macOS certificate
        uses: apple-actions/import-codesign-certs@v2
        with:
          p12-file-base64: ${{ secrets.MACOS_CERTIFICATE }}
          p12-password: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      - name: Sign DMG
        run: |
          for dmg in artifacts/*.dmg; do
            codesign --sign "Developer ID Application: VisualLLM" \
              --timestamp \
              --options runtime \
              "$dmg"
          done
      - name: Upload signed artifacts
        uses: actions/upload-artifact@v4
        with:
          name: visualllm-macos-signed
          path: artifacts/*.dmg

  windows-sign:
    name: Sign Windows artifacts
    needs: windows
    runs-on: windows-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4
      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: visualllm-windows
          path: artifacts
      - name: Install Windows certificate
        run: |
          $cert = "${{ secrets.WINDOWS_CERTIFICATE }}"
          $cert | ConvertFrom-Base64 | Set-Content -Path certificate.pfx -Encoding Byte
      - name: Sign MSI and NSIS
        run: |
          $certPass = "${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}"
          signtool sign /f certificate.pfx /p $certPass /tr http://timestamp.digicert.com /td sha256 /fd sha256 artifacts/*.msi
          signtool sign /f certificate.pfx /p $certPass /tr http://timestamp.digicert.com /td sha256 /fd sha256 artifacts/*.exe
      - name: Upload signed artifacts
        uses: actions/upload-artifact@v4
        with:
          name: visualllm-windows-signed
          path: artifacts/*.msi

  release:
    name: Create GitHub Release
    needs: [linux, windows, macos]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Show downloaded files
        run: |
          find artifacts -type f \( -name "*.deb" -o -name "*.AppImage" -o -name "*.msi" -o -name "*.exe" -o -name "*.dmg" -o -name "*.sig" -o -name "*.tar.gz" -o -name "SHA256SUMS*" \) | sort
          ls -la artifacts/

      - name: Generate latest.json
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          python3 - "$TAG" <<'PY'
          import glob, json, os, sys, datetime

          tag = sys.argv[1]
          version = tag.lstrip("v")
          base = f"https://github.com/CreativeSystemDesign/visualllm/releases/download/{tag}"

          platforms = {}
          for sig in sorted(glob.glob("artifacts/**/*.sig", recursive=True)):
              name = os.path.basename(sig)[:-4]
              with open(sig) as f:
                  signature = f.read().strip()
              if name.endswith(".AppImage"):
                  key = "linux-x86_64-appimage"
              elif name.endswith(".deb"):
                  key = "linux-x86_64-deb"
              elif name.endswith(".msi"):
                  key = "windows-x86_64-msi"
              elif name.endswith("-setup.exe"):
                  key = "windows-x86_64-nsis"
              elif name.endswith(".app.tar.gz"):
                  arch = "aarch64" if "aarch64" in name else "x86_64"
                  key = f"darwin-{arch}"
              else:
                  continue
              platforms[key] = {
                  "signature": signature,
                  "url": f"{base}/{name}",
              }

          manifest = {
              "version": version,
              "notes": f"VisualLLM {version}",
              "pub_date": datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
              "platforms": platforms,
          }
          with open("artifacts/latest.json", "w") as f:
              json.dump(manifest, f, indent=2)
          PY
          cat artifacts/latest.json

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/**/*.deb
            artifacts/**/*.AppImage
            artifacts/**/*.msi
            artifacts/**/*.exe
            artifacts/**/*.dmg
            artifacts/**/*.app.tar.gz
            artifacts/**/*.sig
            artifacts/**/SHA256SUMS*
            artifacts/latest.json

  # Create tar.gz for Homebrew/AUR/Flatpak
  create-tarball:
    name: Create tarball
    needs: [linux, windows, macos, release]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download Linux artifacts
        uses: actions/download-artifact@v4
        with:
          name: visualllm-linux
          path: artifacts
      - name: Create tar.gz from AppImage
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          mkdir -p visualllm-${TAG}
          # Use the AppImage as the distributable binary (it's in artifacts/appimage/)
          cp artifacts/appimage/*.AppImage visualllm-${TAG}/visualllm
          chmod +x visualllm-${TAG}/visualllm
          tar -czf visualllm-${TAG}.tar.gz visualllm-${TAG}
          sha256sum visualllm-${TAG}.tar.gz > SHA256SUMS-tarball.txt
          cat SHA256SUMS-tarball.txt
      - name: Upload tarball
        uses: actions/upload-artifact@v4
        with:
          name: visualllm-tarball
          path: |
            visualllm-*.tar.gz
            SHA256SUMS-tarball.txt

  # ------------------------------------------------------------------
  # Post-release: package for additional distribution channels
  # ------------------------------------------------------------------
  homebrew:
    name: Homebrew tap
    needs: [linux, windows, macos, release, create-tarball]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    env:
      HOMEBREW_NO_REQUIRE_TAP_TRUST: 1
    steps:
      - uses: actions/checkout@v4
      - name: Download tarball for sha256
        uses: actions/download-artifact@v4
        with:
          name: visualllm-tarball
          path: artifacts
      - name: Calculate sha256 for tar.gz
        id: sha256
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          TAR_GZ=$(find artifacts -name "*.tar.gz" | head -1)
          if [ -z "$TAR_GZ" ]; then
            echo "No tar.gz found"
            exit 1
          fi
          SHA256=$(sha256sum "$TAR_GZ" | cut -d' ' -f1)
          echo "sha256=$SHA256" >> $GITHUB_OUTPUT
          echo "Found tar.gz: $TAR_GZ"
          echo "SHA256: $SHA256"
      - name: Update Homebrew tap
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          SHA256="${{ steps.sha256.outputs.sha256 }}"
          # Clone the tap repo
          git clone https://x-access-token:${{ secrets.HOMEBREW_TAP_TOKEN }}@github.com/CreativeSystemDesign/homebrew-visualllm.git /tmp/homebrew-visualllm
          cd /tmp/homebrew-visualllm
          # Update the formula
          sed -i "s|url \".*\"|url \"https://github.com/CreativeSystemDesign/visualllm/releases/download/${TAG}/visualllm-${TAG}.tar.gz\"|" Formula/visualllm.rb
          sed -i "s|sha256 \".*\"|sha256 \"${SHA256}\"|" Formula/visualllm.rb
          # Commit and push
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -am "Update visualllm to ${TAG}"
          git push

  # AUR package - DISABLED (AUR account setup pending)
